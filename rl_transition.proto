syntax = "proto3";

package rl;

message Transition {
  repeated float state = 1;
  repeated int32 action = 2;
  float reward = 3;
  int32 done = 4;
  repeated float next_state = 5;
  repeated float log_prob = 6;
  float value = 7;
  float next_value = 8;
}

// 批量（Sequence or Replay Buffer Chunk）
message TransitionBatch {
  repeated Transition transitions = 1;
  string model_tag = 2;
  int32 version = 3;
}
